format = """
[╭─](fg:cyan) [\\[](fg) $directory$git_branch$git_status$python$nodejs$rust$golang$docker_context$conda[\\]](fg) 
[╰─── ](bold fg:cyan) """

right_format = """
[--{](bold green) $cmd_duration $time [}--](bold green)
"""

continuation_prompt = '[▶▶ ](fg:gray)'

palette = 'cyberdream'
add_newline = true

# =========================
# PALETTE
# =========================

[palettes.cyberdream]

bg       = "#141826"
fg       = "#b8b8ff"

cyan     = "#2ef8b6"
cyan2    = "#7dffd6"

pink     = "#ff4fd8"
pink2    = "#ff9ceb"

blue     = "#7aa2ff"
blue2    = "#a9c1ff"

lavender = "#c8a8ff"

white    = "#ffffff"

gray     = "#3a415c"
dark     = "#09101d"

# =========================
# DIRECTORY
# =========================

[directory]
style = "bold fg:lavender"
format = "[$path ]($style)"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"Projects" = "󰲋 "

# =========================
# GIT
# =========================

[git_branch]
symbol = " "
style = "fg:cyan"
format = "[$symbol$branch ]($style)"

[git_status]
style = "fg:pink"
format = '([$all_status$ahead_behind ]($style))'

conflicted = "󱚡 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = " "
stashed = "󰈉 "
modified = " "
staged = " "
renamed = " "
deleted = "󱂥 "

# =========================
# LANGUAGES
# =========================

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:pink2"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:cyan2"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "fg:blue2"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "fg:red"
format = "[$symbol($version )]($style)"

[kotlin]
symbol = " "
style = "fg:lavender"
format = "[$symbol($version )]($style)"

[haskell]
symbol = " "
style = "fg:lavender"
format = "[$symbol($version )]($style)"

[php]
symbol = " "
style = "fg:blue"
format = "[$symbol($version )]($style)"

# =========================
# DOCKER / CONDA
# =========================

[docker_context]
symbol = " "
style = "fg:blue2"
format = "[$symbol$context ]($style)"

[conda]
symbol = " "
style = "fg:cyan2"
format = "[$symbol$environment ]($style)"
ignore_base = false

# =========================
# CMD DURATION
# =========================

[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "fg:blue2"
format = "[󰓅 $duration ]($style)"
disabled = false

# =========================
# TIME
# =========================

[time]
disabled = false
time_format = "%R"
style = "fg:cyan2"
format = "[󰥔 $time ]($style)"

# =========================
# CHARACTER
# =========================

[character]
disabled = false

success_symbol = "[❯](bold fg:cyan)"
error_symbol = "[❯](bold fg:pink)"

vimcmd_symbol = "[❮](bold fg:lavender)"
vimcmd_replace_one_symbol = "[❮](bold fg:pink2)"
vimcmd_replace_symbol = "[❮](bold fg:pink)"
vimcmd_visual_symbol = "[❮](bold fg:blue2)"

# =========================
# LINE BREAK
# =========================

[line_break]
disabled = true

# =========================
# OS
# =========================

[os]
disabled = false
style = "fg:gray"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
